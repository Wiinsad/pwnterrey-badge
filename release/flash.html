<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pwnterrey Badge Flasher</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    h1 { color: #58a6ff; }
    p { max-width: 500px; text-align: center; line-height: 1.6; }
    esp-web-install-button {
      margin-top: 20px;
    }
    esp-web-install-button::part(invoke-button) {
      background: #238636;
      color: white;
      border: none;
      padding: 12px 32px;
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
      font-weight: 600;
    }
    esp-web-install-button::part(invoke-button):hover {
      background: #2ea043;
    }
    .note {
      margin-top: 24px;
      font-size: 14px;
      color: #8b949e;
      max-width: 500px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>⚡ Pwnterrey Badge Flasher</h1>
  <p>Conecta tu badge por USB, haz clic en el botón y listo. Necesitas Google Chrome o Microsoft Edge.</p>

  <esp-web-install-button manifest="manifest.json"></esp-web-install-button>

  <p class="note">
    Si el botón no aparece, asegúrate de usar Chrome/Edge y que tu badge esté conectado por USB.
    En Linux puede que necesites permisos: <code>sudo usermod -a -G dialout $USER</code>
  </p>

  <script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>
</body>
</html>
